[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
parallel = true
source = ["app", "services/private-fitness-mcp/fitness", "services/personal-context/context_service", "services/chatgpt-mcp"]

[tool.coverage.report]
show_missing = true
fail_under = 77

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts/android_bootstrap.py", "scripts/check_publication.py"]
