name: Verify
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock'
      - run: python -m pip check
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m mypy
      - run: python scripts/check_publication.py
      - run: docker build --pull -t private-fitness-check .
      - run: python scripts/test_mysql.py --dashboard-image private-fitness-check
      - run: python -m coverage report
      - run: python scripts/audit_images.py private-fitness-check private-fitness-mysql:local
      - run: python -m pip_audit -r requirements-dev.lock --no-deps --disable-pip
      - run: node --test tests/web/*.test.cjs
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_browser.py
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python3 scripts/android_bootstrap.py testDebugUnitTest assembleDebug lintDebug
      - run: python3 scripts/audit_android.py
