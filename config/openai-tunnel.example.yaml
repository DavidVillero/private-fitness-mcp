# Optional provider-specific integration; no tunnel executable is distributed.
# Validate against the provider's current documentation and your authorized account.
config_version: 1
control_plane:
  base_url: https://api.openai.com
  tunnel_id: REPLACE_WITH_YOUR_TUNNEL_ID
  api_key: env:CONTROL_PLANE_API_KEY
health:
  unix_socket: /absolute/path/to/private-fitness/secrets/tunnel-health.sock
admin_ui:
  open_browser: false
log:
  level: warn
  format: json
mcp:
  commands:
    - channel: main
      command: /absolute/path/to/private-fitness/scripts/fitness-hq-mcp
